<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    background-color: rgb(239, 248, 226);
}
.card{
width: 90%;
max-width: 500px;
height: 550px;
margin: 100px auto 0;
border: 1.5px solid black;
border-radius: 30px;
text-align: center;
background-color: rgb(124, 225, 225);
}

.search{
    padding-top: 20px;
    display: flex;
    justify-content: center;
}
.search-txt{
    height: 50px;
    width: 300px;
    border: 2px solid black;
    border-radius: 20px;
    padding-left: 20px;
}
input{

font-size: 20px;
font-weight: 600;
}
.search-img{
    height: 20px;
    width: 25px;
    border-radius: 50px;
    
}

.search-img-box{
    height: 50px;
    width: 60px;
    border-radius: 100px;
    margin-left: 20px;
    
}


.weather-img{
    height: 220px;
    width: 220px;
}


.details{

    display: flex;
    flex-direction: row;
    justify-content: center;
}
.humidity-img{

    height: 50px;
    width: 50px;
    margin-top: 40px;
    margin-right: 50px;
}

.wind-img{
     height: 50px;
    width: 50px;
    margin-top: 40px;
    margin-left: 50px;
}

.humidity{
    margin-right: 60px;
    font-size: 20px;
}

.wind{
    margin-left: 60px;
    font-size: 20px;
}

.error{
    text-align: left;
    font-size: 20px;
    margin-left: 80px;
    margin-top: 10px;
    color: gray;
    display: none;
}



@media (max-width : 350px) {
    .card{
       width: 90%;
max-width: 450px;
height: 500px; 
    }
    .search-txt{
        height: 30px;
        width: 150px;
    }


    .search-img-box{
    height: 30px;
    width: 40px;
    border-radius: 100px;
    margin-left: 15px;
    
}
input{
font-size: 10px;
font-weight: 400;
}

.search-img{
    height: 10px;
    width: 15px;
    
}

.weather-img{
    height: 150px;
    width: 150px;
    margin-top: 50px;
}
.city,.temp{
    font-size: 25px;
}

.humidity-img{
    
    height: 40px;
    width: 40px;
    margin-top: 30px;
    margin-left: 330px;
    margin-top: 50px;

}
.humidity{
     margin-right: 60px;
    font-size: 18px;
     margin-left: 330px;
     margin-top: 5px;
     font-weight: 550;
}

.wind-img{
     height: 40px;
    width: 40px;
    margin-top: 30px;
    margin-right: 330px;
    margin-top: 50px;
    

}
.wind{
     margin-right: 60px;
    font-size: 18px;
     margin-right: 330px;
     margin-top: 5px;
     font-weight: 550;
}

}

</style>
</head>
<body>



<div class="card">

    <div class="search">

        <input class="search-txt" type="text" placeholder="enter city name" spellcheck="false">
        <button class="search-img-box"><img class="search-img" src="image.png/search-interface-symbol.png" alt="search"></button>
    </div>
<div class="error">
    <p>Invalid city name</p>
</div>
<div class="weather">

    <img class="weather-img" src="image.png/storm.png" alt="img">
    <h1 class="temp">22°c</h1>
    <h2 class="city">New York</h2>
    <div class="details">
        <div class="col-1">
            <img class="humidity-img" src="image.png/humidity.png" alt="humidity">
            <div>
                <p class="humidity">50%</p>
                <p class="humidity">Humidity</p>
            </div>
        </div>


         <div class="col-2">
            <img class="wind-img" src="image.png/wind.png" alt="wind">
            <div>
                <p class="wind">15 km/hr</p>
                <p class="wind">Wind</p>
            </div>
        </div>

    </div>
</div>

</div>



<script src="weather.js">

</script>





    

</body>
</html>
